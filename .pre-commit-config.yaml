repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: make lint-api
        language: system
        pass_filenames: false
        files: ^api/.*\.py$

      - id: frontend-lint
        name: Frontend lint
        entry: frontend/node_modules/.bin/eslint
        language: system
        files: ^frontend/.*\.(js|jsx)$

      - id: backend-tests
        name: Backend tests
        entry: make test-api
        language: system
        pass_filenames: false
        files: ^api/.*\.py$

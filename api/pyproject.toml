[project]
name = "couch-commander-api"
version = "0.1.0"
description = "Couch Commander API"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs",
    "aiohttp",
    "aiosignal",
    "alembic",
    "aniso8601",
    "asgiref",
    "async-timeout",
    "attrs",
    "blinker",
    "certifi",
    "charset-normalizer",
    "click",
    "flask",
    "flask-cors",
    "flask-migrate",
    "flask-restful",
    "flask-sqlalchemy",
    "frozenlist",
    "greenlet",
    "h11",
    "idna",
    "importlib-metadata",
    "itsdangerous",
    "jinja2",
    "mako",
    "markupsafe",
    "multidict",
    "python-dotenv",
    "pytz",
    "six",
    "sqlalchemy",
    "typing-extensions",
    "werkzeug",
    "yarl",
    "zipp",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
